- slug: customer-retention
  title: Customer Revenue Recovery & Retention ROI Engine
  area: Retention strategy
  short_area: Retention
  question: Who should receive a paid offer, and what would justify spending more?
  contribution: I combined churn risk, customer value, and offer cost to build an eligibility screen and propose a controlled test.
  url: /projects/customer-retention/
  dashboard: https://public.tableau.com/app/profile/aaditya.mandal/viz/CustomerRevenueRecoveryRetentionROIDashboard/ModelConfidenceGovernanceBoard
  repository: https://github.com/aadimandall/customer-revenue-recovery-retention-ROI-engine-
  workflow_title: Retention offer workflow
  workflow_alt: Combine churn risk and customer value, screen paid offers for positive expected net value, simulate budgets, then design a controlled test.
  workflow:
    - name: Score risk & value
      detail: Combine churn likelihood with profit-adjusted lifetime value and lifecycle context.
    - name: Screen paid offers
      detail: Apply a response assumption and subtract the estimated intervention cost.
    - name: Simulate budgets
      detail: Compare targeting depth, expected net value, and break-even response.
    - name: Design the test
      detail: Randomize across treatment and control and define rollout criteria.
