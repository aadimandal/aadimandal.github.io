- slug: operations
  title: Operations KPI & Service-Flow Analytics
  area: Campus operations
  short_area: Operations
  question: How could a recreation team get more games started on time during its busiest hours?
  contribution: I tracked nightly performance, found recurring coverage and scheduling issues, and supported the team’s adjustments.
  url: /projects/operations/
  workflow_title: Recreation operations workflow
  workflow_alt: Log nightly recreation metrics, review weekly KPI reports for late starts and staffing gaps, then use the findings to adjust coverage and schedules.
  workflow:
    - name: Log nightly activity
      detail: Track participation, forfeits, incidents, coverage, and schedule performance.
    - name: Review weekly KPIs
      detail: Identify recurring late starts, peak bottlenecks, and gaps in staffing coverage.
    - name: Adjust schedules
      detail: Use the findings to inform staffing, scheduling, and league-format changes.
