{% assign flow_project = include.project %}
<div class="workflow{% if include.compact %} workflow--compact{% endif %}"{% unless include.compact %} data-workflow-beam{% endunless %} role="img" aria-label="{{ flow_project.workflow_alt | escape }}">
  <div aria-hidden="true">
    <p class="workflow__title">{{ flow_project.workflow_title }}</p>
    <ol class="workflow__steps">
      {% for step in flow_project.workflow %}
      <li{% unless include.compact %} style="--workflow-step: {{ forloop.index0 }}"{% endunless %}>
        <strong>{{ step.name }}</strong>
        {% unless include.compact %}<span>{{ step.detail }}</span>{% endunless %}
      </li>
      {% endfor %}
    </ol>
  </div>
</div>
