<head>
  {% assign description = page.description | default: site.description %}
  {% capture title %}{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}{% endcapture %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ description | escape }}">
  <meta name="theme-color" content="#081424">
  <title>{{ title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title | escape }}">
  <meta property="og:description" content="{{ description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: site.image | absolute_url }}">
  <meta property="og:image:alt" content="{{ page.image_alt | default: 'Portrait of Aaditya Mandal' | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
</head>
