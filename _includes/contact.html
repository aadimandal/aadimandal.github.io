<section class="contact" id="contact" tabindex="-1" aria-labelledby="contact-title">
  <div>
    <h2 id="contact-title">Let’s talk about the decisions your team is working through.</h2>
    <p>I’m interested in strategy and analytics consulting, decision science, and work where the analysis has to hold up in practice.</p>
  </div>
  <ul class="contact__links">
    <li><a class="button button--compact" href="{{ site.linkedin }}">LinkedIn</a></li>
    <li><a class="button button--compact" href="{{ site.github_profile }}">GitHub</a></li>
    {% if site.professional_email %}<li><a class="button button--compact" href="mailto:{{ site.professional_email }}">Email</a></li>{% endif %}
  </ul>
</section>
